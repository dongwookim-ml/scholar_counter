# Scrapes Google Scholar once a day, commits the snapshot, and republishes
# the dashboard to GitHub Pages.
name: Daily citation update

on:
  schedule:
    # 18:00 UTC == 03:00 KST the next morning, matching the old local schedule.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Republish when the site itself changes, not on every code commit.
      - "scholar_counter/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs write snapshots or deploy at the same time.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Scrape Google Scholar
        id: scrape
        if: github.event_name != 'push'
        env:
          PYTHONPATH: .
        run: |
          # Scholar rate-limits intermittently, so retry before giving up.
          for attempt in 1 2 3; do
            if python -m scholar_counter.cli update; then
              python -m scholar_counter.cli status
              exit 0
            fi
            echo "::warning::Attempt $attempt failed; retrying in 120s"
            sleep 120
          done
          echo "::error::Google Scholar could not be reached after 3 attempts."
          exit 1

      - name: Commit the snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "Record citation snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build the static site
        env:
          PYTHONPATH: .
        run: python -m scholar_counter.cli build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
