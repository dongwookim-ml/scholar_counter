# Temporary diagnostic: can a GitHub-hosted runner reach Google Scholar at all?
# Google blocks datacenter IPs far more readily than residential ones, so this
# answers the question before we build a daily crawl on top of the assumption.
name: Probe Scholar reachability

on:
  push:
    branches: [github-actions-daily-crawl]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Report runner egress IP
        run: curl -s https://api.ipify.org && echo

      - name: Try to fetch the profile
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import requests
          from scholar_counter.config import Settings

          s = Settings()
          r = requests.get(
              s.profile_url,
              params={"cstart": 0, "pagesize": 100},
              headers=s.request_headers,
              timeout=30,
              allow_redirects=True,
          )
          print(f"status      : {r.status_code}")
          print(f"final url   : {r.url}")
          print(f"bot check   : {'/sorry/' in r.url or r.status_code == 429}")
          print(f"body bytes  : {len(r.content)}")

          from scholar_counter.scraper import parse_page
          papers = parse_page(r.content)
          print(f"papers found: {len(papers)}")
          if papers:
              title, count = next(iter(papers.items()))
              print(f"sample      : {title[:60]} = {count}")
          PY
